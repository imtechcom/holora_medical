name: CD — Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.APP_DIR || '/var/www/html/holora_medical' }}"
            REPO_URL="https://github.com/imtechcom/holora_medical.git"
            COMPOSE_FILE="$APP_DIR/docker/docker-compose.yml"
            ENV_FILE="$APP_DIR/docker/.env"

            if [ ! -d "$APP_DIR" ]; then
              echo "==> Folder missing. Creating and cloning..."
              mkdir -p "$(dirname "$APP_DIR")"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Rebuilding & restarting containers..."
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --build --remove-orphans

            echo "==> Waiting for services..."
            sleep 15

            echo "==> Health check..."
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps

            # Backend health check
            if curl -fsSL http://127.0.0.1:5000/ >/dev/null 2>&1; then
              echo "✅ Backend is healthy"
            else
              echo "⚠️ Backend not responding yet (may still be starting)"
            fi

            # Frontend health check
            if curl -fsSL http://127.0.0.1:80/ >/dev/null 2>&1; then
              echo "✅ Frontend is healthy"
            else
              echo "⚠️ Frontend not responding yet (may still be starting)"
            fi

            echo "✅ Deploy completed!"
