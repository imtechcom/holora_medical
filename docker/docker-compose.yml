services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-holora_medical}
      MYSQL_USER: ${MYSQL_USER:-holora_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../holora_medical.sql:/docker-entrypoint-initdb.d/01-data.sql:ro
      - ./finalize.sql:/docker-entrypoint-initdb.d/02-finalize.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - holora_network

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - holora_network

  image-processing:
    build:
      context: ../image-processing
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-holora_app}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=holora_image_processing_db
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../image-processing:/app
    networks:
      - holora_network

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-holora_medical}
      DB_USER: ${MYSQL_USER:-holora_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5175,http://localhost:5173,http://localhost,http://localhost:80}
      IMAGE_PROCESSING_URL: ${IMAGE_PROCESSING_URL:-http://image-processing:8000}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules
      - ../backend/public/uploads:/app/public/uploads
    networks:
      - holora_network

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - holora_network

networks:
  holora_network:
    driver: bridge

volumes:
  mysql_data:
